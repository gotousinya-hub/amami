<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">塩昆布燻製ナッツとビールのスタイリング写真風イメージ</title>
  <desc id="desc">木のカウンターにパッケージ、グラスビール、小皿に盛ったナッツを配置した温かい雰囲気のビジュアル。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2315"/>
      <stop offset="0.44" stop-color="#120d0a"/>
      <stop offset="1" stop-color="#6e3f17"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5427"/>
      <stop offset="0.45" stop-color="#c17d3b"/>
      <stop offset="1" stop-color="#754219"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c77918"/>
      <stop offset="0.45" stop-color="#ffd26d"/>
      <stop offset="0.78" stop-color="#b96812"/>
      <stop offset="1" stop-color="#7a3e0e"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f3ed" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d8d0c2" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#090605" flood-opacity="0.38"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#120b06" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="780" cy="140" r="170" fill="#c57d2e" opacity="0.18" filter="url(#blur)"/>
  <circle cx="160" cy="165" r="130" fill="#f2b866" opacity="0.15" filter="url(#blur)"/>
  <rect y="455" width="960" height="265" fill="url(#wood)"/>
  <path d="M0 500 C155 472 286 536 450 500 C626 463 754 535 960 486" fill="none" stroke="#5b2e12" stroke-width="5" opacity="0.35"/>
  <path d="M0 582 C185 552 320 606 505 570 C670 538 780 592 960 566" fill="none" stroke="#f0b66a" stroke-width="3" opacity="0.18"/>

  <g filter="url(#shadow)">
    <path d="M263 112 h278 q26 0 26 26 v430 q0 28-28 28 H265 q-28 0-28-28 V138 q0-26 26-26z" fill="url(#bag)" stroke="#fff" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M258 150 h300" stroke="#f8f0df" stroke-width="8" opacity="0.42"/>
    <path d="M258 170 h300" stroke="#ffffff" stroke-width="2" opacity="0.52"/>
    <rect x="295" y="246" width="210" height="260" rx="4" fill="#d6b681" stroke="#24170e" stroke-width="4"/>
    <path d="M314 265 h170 v220 H314z" fill="none" stroke="#24170e" stroke-width="2" opacity="0.6"/>
    <text x="407" y="329" text-anchor="middle" font-family="serif" font-size="42" font-weight="700" writing-mode="tb" glyph-orientation-vertical="0" fill="#24170e">塩昆布</text>
    <text x="352" y="340" text-anchor="middle" font-family="serif" font-size="37" font-weight="700" writing-mode="tb" glyph-orientation-vertical="0" fill="#24170e">燻製ナッツ</text>
    <text x="400" y="473" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#3d2b1d">香ばしいナッツと昆布の旨み</text>
  </g>

  <g opacity="0.95" filter="url(#softShadow)">
    <ellipse cx="390" cy="397" rx="130" ry="122" fill="#23170f" opacity="0.1"/>
    <g fill="#b86b35">
      <ellipse cx="320" cy="356" rx="24" ry="37" transform="rotate(-28 320 356)"/>
      <ellipse cx="476" cy="372" rx="24" ry="38" transform="rotate(24 476 372)"/>
      <ellipse cx="462" cy="508" rx="25" ry="39" transform="rotate(-34 462 508)"/>
      <ellipse cx="327" cy="515" rx="23" ry="37" transform="rotate(28 327 515)"/>
    </g>
    <g fill="#e4b66f">
      <circle cx="367" cy="361" r="24"/><circle cx="439" cy="430" r="25"/><circle cx="358" cy="470" r="22"/><circle cx="426" cy="530" r="21"/>
    </g>
    <g fill="#c79045">
      <path d="M386 420 c32-17 66 5 48 36 c-18 30-68 20-70-11 c-1-10 7-19 22-25z"/>
      <path d="M333 425 c28-17 60 0 50 28 c-12 34-66 31-72 2 c-2-11 5-22 22-30z"/>
    </g>
    <g stroke="#10140f" stroke-width="12" stroke-linecap="round">
      <path d="M315 408 l64 84"/><path d="M453 330 l-58 91"/><path d="M505 428 l-72 57"/><path d="M340 322 l84 48"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <path d="M681 144 q-13 18-13 55 v295 q0 52 44 65 q54 16 107 0 q45-13 45-65 V199 q0-37-13-55z" fill="url(#beer)" opacity="0.94" stroke="#fff5df" stroke-opacity="0.34" stroke-width="4"/>
    <path d="M674 148 q86-34 184 0 q14 30 7 56 q-94 22-199 0 q-6-26 8-56z" fill="#fff3d6"/>
    <path d="M697 160 q65-20 136 0 q17 10 24 30 q-89 18-182 0 q7-21 22-30z" fill="#fff9e8" opacity="0.9"/>
    <rect x="699" y="220" width="25" height="265" rx="12" fill="#fff9d8" opacity="0.2"/>
    <g fill="#fff3c8" opacity="0.4">
      <circle cx="806" cy="284" r="5"/><circle cx="782" cy="343" r="3"/><circle cx="828" cy="391" r="4"/><circle cx="742" cy="415" r="3"/><circle cx="812" cy="457" r="3"/>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <ellipse cx="612" cy="570" rx="174" ry="42" fill="#2b170b" opacity="0.35"/>
    <ellipse cx="612" cy="548" rx="174" ry="55" fill="#fff7eb"/>
    <ellipse cx="612" cy="540" rx="130" ry="34" fill="#efe2d0"/>
    <g transform="translate(520 481)">
      <ellipse cx="42" cy="46" rx="17" ry="28" fill="#b76531" transform="rotate(-38 42 46)"/>
      <ellipse cx="94" cy="50" rx="18" ry="29" fill="#ba6a34" transform="rotate(32 94 50)"/>
      <circle cx="126" cy="58" r="21" fill="#e8ba72"/>
      <path d="M77 39 c30-18 62 6 41 35 c-20 27-67 13-64-15 c1-8 8-15 23-20z" fill="#c68b42"/>
      <path d="M11 56 l74 42M153 30 l-66 70M69 12 l41 95" stroke="#11160f" stroke-width="10" stroke-linecap="round"/>
      <circle cx="52" cy="86" r="19" fill="#e0aa61"/><ellipse cx="147" cy="83" rx="17" ry="27" fill="#a75e2d" transform="rotate(-20 147 83)"/>
    </g>
  </g>
</svg>
