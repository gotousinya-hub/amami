<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
  <title id="title">塩昆布燻製ナッツのパッケージ写真風イメージ</title>
  <desc id="desc">白背景に立つ透明パウチ入りの塩昆布燻製ナッツ。クラフト紙ラベル付き。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe9df"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9ece7" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#d0c7bb" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#5c4938" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#6b4b31" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="760" height="920" fill="url(#paper)"/>
  <circle cx="120" cy="120" r="160" fill="#f1d7ae" opacity="0.24"/>
  <circle cx="650" cy="760" r="210" fill="#d8c3a4" opacity="0.22"/>

  <g filter="url(#shadow)">
    <path d="M185 82 h390 q40 0 40 40 v654 q0 44-44 44 H189 q-44 0-44-44 V122 q0-40 40-40z" fill="url(#bag)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.65"/>
    <path d="M170 144 h420" stroke="#ffffff" stroke-width="14" opacity="0.46"/>
    <path d="M180 168 h400" stroke="#d9d0c5" stroke-width="4" opacity="0.6"/>
    <path d="M190 204 q190 18 380 0" fill="none" stroke="#fff" stroke-width="2" opacity="0.52"/>
  </g>

  <g filter="url(#smallShadow)">
    <g fill="#b96c35">
      <ellipse cx="270" cy="282" rx="28" ry="45" transform="rotate(-30 270 282)"/>
      <ellipse cx="494" cy="300" rx="28" ry="46" transform="rotate(30 494 300)"/>
      <ellipse cx="492" cy="686" rx="29" ry="47" transform="rotate(-28 492 686)"/>
      <ellipse cx="260" cy="700" rx="27" ry="43" transform="rotate(22 260 700)"/>
      <ellipse cx="550" cy="518" rx="24" ry="38" transform="rotate(20 550 518)"/>
      <ellipse cx="220" cy="500" rx="23" ry="38" transform="rotate(-22 220 500)"/>
    </g>
    <g fill="#e7ba72">
      <circle cx="340" cy="280" r="30"/><circle cx="440" cy="345" r="29"/><circle cx="310" cy="622" r="28"/><circle cx="442" cy="724" r="29"/><circle cx="520" cy="410" r="25"/>
    </g>
    <g fill="#c99249">
      <path d="M330 390 c40-23 86 6 60 46 c-24 38-87 24-88-17 c0-12 10-22 28-29z"/>
      <path d="M245 400 c42-24 82 5 62 43 c-21 42-88 31-91-9 c-1-14 8-25 29-34z"/>
      <path d="M430 595 c44-24 91 8 63 48 c-29 41-94 22-91-20 c1-12 10-21 28-28z"/>
    </g>
    <g stroke="#151a13" stroke-width="14" stroke-linecap="round">
      <path d="M244 332 l96 126"/><path d="M492 255 l-94 143"/><path d="M555 442 l-116 88"/><path d="M260 575 l136 76"/><path d="M515 630 l-142-88"/>
    </g>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="246" y="325" width="272" height="338" rx="5" fill="#d8b987" stroke="#25170e" stroke-width="5"/>
    <rect x="270" y="349" width="224" height="290" fill="none" stroke="#25170e" stroke-width="2.5" opacity="0.65"/>
    <path d="M300 412 c18-34 26-63 14-92 c26 23 39 54 26 94" fill="none" stroke="#25170e" stroke-width="4" stroke-linecap="round"/>
    <path d="M334 415 c11-41 26-70 54-92 c0 37-15 70-44 98" fill="none" stroke="#25170e" stroke-width="4" stroke-linecap="round"/>
    <text x="419" y="416" text-anchor="middle" font-family="serif" font-size="48" font-weight="700" writing-mode="tb" glyph-orientation-vertical="0" fill="#25170e">塩昆布</text>
    <text x="351" y="448" text-anchor="middle" font-family="serif" font-size="43" font-weight="700" writing-mode="tb" glyph-orientation-vertical="0" fill="#25170e">燻製ナッツ</text>
    <text x="382" y="604" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#3d2b1d">燻製ナッツと昆布の旨み</text>
  </g>

  <path d="M163 228 c56 8 92 8 140-5M510 230 c31 9 66 8 94-5M176 742 c45 18 87 20 126 5M500 750 c45 10 75 4 101-11" fill="none" stroke="#fff" stroke-width="4" opacity="0.42"/>
</svg>
